stages:
- kubectl-test
variables:
  env= "dev"
  config= "KubeConfig_Raypro_"
kubectl-test:
  stage: kubectl-test
  before_script:
    
    export KUBECONFIG="${config}${env}"
    echo "$KUBECONFIG"
    export KUBECONFIG=$(!KUBECONFIG)
    echo "config=$KUBECONFIG"
  script:
    
    kubectl get pod -n dev
