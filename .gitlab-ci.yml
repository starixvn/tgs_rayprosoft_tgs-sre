stages:
  - deploy

deploy_dev:
  stage: deploy
  script:
    - echo "Using KUBECONFIG from GitLab CI/CD variables"
    - kubectl get pod -n dev --kubeconfig=$KubeConfig_Raypro_dev
  only:
    - main

deploy_stag:
  stage: deploy
  script:
    - echo "Using KUBECONFIG from GitLab CI/CD variables"
    - kubectl get pod -n stag --kubeconfig=$KubeConfig_Raypro_staging
  only:
    - stag

deploy_prod:
  stage: deploy
  script:
    - echo "Using KUBECONFIG from GitLab CI/CD variables"
    - kubectl get pod -n prod --kubeconfig=$KubeConfig_Raypro_prod
  only:
    - prod