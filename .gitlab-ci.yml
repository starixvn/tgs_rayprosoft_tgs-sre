stages:
- kubectl-test
variables:
  env: "dev"
  kuconfig: "KubeConfig_Raypro_"
kubectl-test:
  stage: kubectl-test
  before_script:
    export KUBECONFIG="${kuconfig}${env}"
    echo "config=$KUBECONFIG"
    export KUBECONFIG=${!KUBECONFIG}
    echo "config=$KUBECONFIG"
  script:
    kubectl get pod -n dev
