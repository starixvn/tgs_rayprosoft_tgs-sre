stages:
  - deploy
variables:
  env: dev
  config: KubeConfig_Raypro_
deploy_dev:
  stage: deploy
  before_script:
    - export KUBECONFIG=$(!${config}${env})
  script:
    - kubectl get pod -n dev 
  only:
    - main

deploy_stag:
  stage: deploy
  script:
    - echo "Using KUBECONFIG from GitLab CI/CD variables"
    - kubectl get pod -n stag --kubeconfig=$KubeConfig_Raypro_staging
  only:
    - stag

deploy_prod:
  stage: deploy
  script:
    - echo "Using KUBECONFIG from GitLab CI/CD variables"
    - kubectl get pod -n prod --kubeconfig=$KubeConfig_Raypro_prod
  only:
    - prod