stages:
  - deploy

deploy_dev:
  stage: deploy
  script:
    - export KUBECONFIG=KubeConfig_Raypro_dev
    - kubectl get pod -n dev
  only:
    - main

deploy_stag:
  stage: deploy
  script:
    - export KUBECONFIG=KubeConfig_Raypro_staging
    - kubectl get pod -n stag
  only:
    - stag

deploy_prod:
  stage: deploy
  script:
    - export KUBECONFIG=KubeConfig_Raypro_prod
    - kubectl get pod -n prod
  only:
    - prod
