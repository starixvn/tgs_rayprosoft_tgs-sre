##如果想要給service配置域名可以參考此範例

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yoursvc-ingress
  namespace: your namespace
spec:
  ingressClassName: nginx
  rules:
  - host: your.host.name
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: console
            port:
              number: your svc port