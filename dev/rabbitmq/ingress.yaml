apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rabbitmq
  namespace: rabbitmq
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules: 
  - host: rabbitmq-bk.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: mq
            port: 
              number: 15672