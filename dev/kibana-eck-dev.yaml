#kubectl apply -f https://download.elastic.co/downloads/eck/2.7.0/crds.yaml
#kubectl apply -f https://download.elastic.co/downloads/eck/2.7.0/operator.yaml
---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: eck
spec:
  config:
    csp.strict: false
    elasticsearch.hosts:
    - http://elasticsearch-es-default:9200
  count: 1
  http:
    service:
      spec:
        type: ClusterIP
    tls:
      selfSignedCertificate:
        disabled: true
  version: 8.11.0
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana
  namespace: eck
spec:
  ingressClassName: nginx
  rules:
  - host: kibana-bk.rpgp.cc
    http:
      paths:
      - backend:
          service:
            name: kibana-kb-http
            port:
              number: 5601
        path: /
        pathType: Prefix